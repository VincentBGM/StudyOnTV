name: Issue 认领

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  claim:
    # 只处理 Issue（不含 PR）里以 /claim 或 /unclaim 开头的评论，忽略机器人
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/claim') ||
       startsWith(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-latest
    steps:
      - name: 处理认领
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {comment, issue} = context.payload;
            const user = comment.user.login;
            const body = comment.body.trim();
            const unclaim = body.startsWith('/unclaim');
            const reply = (text) =>
              github.rest.issues.createComment({owner, repo, issue_number, body: text});

            const assignees = (issue.assignees || []).map((a) => a.login);

            if (unclaim) {
              if (!assignees.includes(user)) {
                return reply(`@${user} 你还没有认领这个 Issue。`);
              }
              await github.rest.issues.removeAssignees({
                owner, repo, issue_number, assignees: [user],
              });
              // 没人认领了才摘掉标签，多人认领时保留
              const {data: fresh} = await github.rest.issues.get({owner, repo, issue_number});
              if ((fresh.assignees || []).length === 0) {
                await github.rest.issues
                  .removeLabel({owner, repo, issue_number, name: 'claimed'})
                  .catch(() => {});
              }
              return reply(`@${user} 已取消认领，这个 Issue 重新开放。`);
            }

            if (assignees.includes(user)) {
              return reply(`@${user} 你已经在认领这个 Issue 了，完成后记得在 PR 里写 \`closes #${issue_number}\`。`);
            }
            if (assignees.length) {
              return reply(
                `这个 Issue 已由 @${assignees.join('、@')} 认领。请先在评论里和对方沟通，避免重复开发；` +
                `如果对方放弃，可以再评论 \`/claim\`。`
              );
            }

            await github.rest.issues.addAssignees({
              owner, repo, issue_number, assignees: [user],
            });

            // 仓库里还没有 claimed 标签时自动建一个，避免 422
            try {
              await github.rest.issues.getLabel({owner, repo, name: 'claimed'});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: 'claimed', color: '1D76DB', description: '已被贡献者认领',
              });
            }
            await github.rest.issues.addLabels({owner, repo, issue_number, labels: ['claimed']});

            return reply(
              `@${user} 已认领。完成后在 PR 里写 \`closes #${issue_number}\`；` +
              `如果做不了，评论 \`/unclaim\` 把 Issue 放回待认领。`
            );
