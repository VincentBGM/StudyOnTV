name: 构建并发布 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 构建家长面板（admin）
        working-directory: parent-ui
        run: |
          npm ci
          npm run build

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: 写入 local.properties
        run: |
          cat > app/native/local.properties <<EOF
          KEYSTORE_PATH=${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASS=${{ secrets.KEY_PASS }}
          EOF

      - name: 构建 TV Release APK
        working-directory: app/native
        run: ./gradlew assembleTvRelease

      - name: 构建 Mobile Release APK
        working-directory: app/native
        run: ./gradlew assembleMobileRelease

      - name: 整理产物
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp app/native/app/build/outputs/apk/tv/release/app-tv-release.apk \
             dist/StudyOnTV-Android-TV-${TAG}.apk
          cp app/native/app/build/outputs/apk/mobile/release/app-mobile-release.apk \
             dist/StudyOnTV-Mobile-${TAG}.apk

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: false
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md
        continue-on-error: true  # 如果没有 RELEASE_NOTES.md 也不报错

      - name: 发布到 GitHub Release（无 notes 文件时兜底）
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
